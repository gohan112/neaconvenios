# Copia continua de la base de datos a un bucket (Google Cloud Storage).
# REPLICA_URL la pone el despliegue, p. ej.:  gcs://mi-bucket/neaevento
dbs:
  - path: /data/evento.db
    replicas:
      - url: ${REPLICA_URL}
        # Cada 10 s. Antes estaba en 1 s, que era precisión de más para 18
        # personas apuntando tiempos: en el peor caso (que se caiga la máquina
        # justo entonces) se pierden los últimos 10 segundos de escritura.
        # A cambio, subimos al bucket 10 veces menos.
        sync-interval: 10s
        # Una instantánea cada 6 h y se guardan 3 días: de sobra para un evento
        snapshot-interval: 6h
        retention: 72h
